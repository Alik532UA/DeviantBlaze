name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Check types & code
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Lint formatting and code
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm run test:unit

      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Resolve base path and origin
        id: site
        if: ${{ !cancelled() }}
        run: |
          if [ -f static/CNAME ]; then
            cname=$(head -n 1 static/CNAME | tr -d '\r\n')
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "origin=https://$cname" >> "$GITHUB_OUTPUT"
          else
            owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            repo='${{ github.event.repository.name }}'
            if [ "$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
              echo "base=" >> "$GITHUB_OUTPUT"
            else
              echo "base=/$repo" >> "$GITHUB_OUTPUT"
            fi
            echo "origin=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        id: build
        if: ${{ !cancelled() }}
        run: npm run build
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}
          SITE_ORIGIN: ${{ steps.site.outputs.origin }}
          NODE_ENV: production

      - name: Verify build quality (SEO-v10)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:build

      - name: Build does not modify tracked files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
