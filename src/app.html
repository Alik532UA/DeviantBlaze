<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Deviant Blaze</title>
		<meta name="description" content="Deviant Blaze — Official Music & Visual Portal" />
		<meta name="theme-color" content="#08080a" />

		<!-- Preload Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />

		<script>
			// Prevent theme flash on load
			try {
				const saved = localStorage.getItem('deviantblaze-theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = saved || (prefersDark ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
				const metaTheme = document.querySelector('meta[name="theme-color"]');
				if (metaTheme) {
					metaTheme.setAttribute('content', theme === 'dark' ? '#08080a' : '#f9f9fb');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
