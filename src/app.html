<!doctype html>
<html lang="uk" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Deviant Blaze — Official Music & Visual Portal</title>
		<meta name="description" content="Офіційний інтерактивний портал рок-гурту Deviant Blaze. Музика на стримінгах, живі виступи, студійне фортепіано та VJ аудіовізуалізатор концертного рівня." />
		<meta name="theme-color" content="#08080a" />

		<!-- Open Graph / Facebook / Telegram / Viber / Discord -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Deviant Blaze" />
		<meta property="og:url" content="https://alik532ua.github.io/DeviantBlaze/" />
		<meta property="og:title" content="Deviant Blaze — Official Music & Visual Portal" />
		<meta property="og:description" content="Офіційний інтерактивний портал рок-гурту Deviant Blaze. Музика на стримінгах, живі виступи, студійне фортепіано та VJ аудіовізуалізатор концертного рівня." />
		<meta property="og:image" content="https://alik532ua.github.io/DeviantBlaze/og-image.png" />
		<meta property="og:image:secure_url" content="https://alik532ua.github.io/DeviantBlaze/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Deviant Blaze — Official Music & Visual Portal" />
		<meta property="og:locale" content="uk_UA" />
		<meta property="og:locale:alternate" content="en_US" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://alik532ua.github.io/DeviantBlaze/" />
		<meta name="twitter:title" content="Deviant Blaze — Official Music & Visual Portal" />
		<meta name="twitter:description" content="Офіційний інтерактивний портал рок-гурту Deviant Blaze. Музика на стримінгах, живі виступи, студійне фортепіано та VJ аудіовізуалізатор концертного рівня." />
		<meta name="twitter:image" content="https://alik532ua.github.io/DeviantBlaze/og-image.png" />

		<!-- Preload Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />

		<script>
			// Prevent theme flash on load
			try {
				const saved = localStorage.getItem('deviantblaze-theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = saved || (prefersDark ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
				const metaTheme = document.querySelector('meta[name="theme-color"]');
				if (metaTheme) {
					metaTheme.setAttribute('content', theme === 'dark' ? '#08080a' : '#f9f9fb');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
